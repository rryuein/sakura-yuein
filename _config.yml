# 视频地址为，配置如下
movies:
  enable: false
  url: none
  # 多个视频用逗号隔开，随机获取。支持的格式目前已知MP4,Flv。其他的可以试下，不保证有用
  name: none

aplayer:  ##媒体播放引擎，移动端会禁止自动播放
  enable: true
  # 歌单接口：MetingJS 默认的 https://api.i-meto.com/meting/api 可能不可用
  # 把下面这行换成可用的镜像地址即可，占位符 :server/:type/:id/:r 保持不变。
  api: "https://api.injahow.cn/meting/?server=:server&type=:type&id=:id&r=:r"
  id: 7466799465 #歌单id
  server: netease #网易云，可换QQ音乐
  type: playlist
  fixed: true ##开启吸底模式，固定到底部
  autoplay: false ##音频自动播放
  loop: all  ##音频循环播放, 可选值: 'all', 'one', 'none'
  order: random ##音频循环顺序, 可选值: 'list', 'random'
  preload: auto ##预加载，可选值: 'none', 'metadata', 'auto'
  volume: 0.5 ##默认音量，请注意播放器会记忆用户设置，用户手动设置音量后默认音量即失效
  mutex: true ##互斥，阻止多个播放器同时播放

