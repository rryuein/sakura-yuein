#----------------------------网页信息----------------------------------
# site name
#prefixName: cungudafa
siteName: 若儿的笔记
# favicon and site master avatar
name: 如若yuein
favicon: https://cdn.jsdelivr.net/gh/rryuein/pagecdn/img/custom/favicon.ico
avatar: https://cdn.jsdelivr.net/gh/rryuein/pagecdn/img/custom/yuein.webp
url: https://rryuein.github.io/
#公告
announcement: 是个人小站喵，都是yuein的主观输出，不对内容的真实性负责，请谨慎阅读哦<br><br>站内大量使用外部素材，如有侵权请联系yuein删除<br><br><br>绝对不是笨蛋！
#尝试 另一处在hexo-theme-sakuraplus\layout\_partial\headrtop.ejs
# 打字效果副标题.
# 如果有符号 ‘ ，请在 ’ 前面加上 \
description:
  enable: true
  loop: false # 是否循环
  showCursor: true # 是否显示光标
  startDelay: 3000 # 开始延迟
  typeSpeed: 120 # 打字速度
  backSpeed: 50 # 删除速度
  backDelay: 1500 #删除延迟
  sub1: 你好，欢迎翻阅若儿的笔记，希望有可以帮到你的东西呀
  sub2: 当然也可以先看看小站的阅览指南，就在下面不远处
  sub3: 如果有什么问题的话也要记得留言哦
  sub4: 祝你开心!
# 可以精简，但没有必要，诶嘿
talk:
  sub1: 咦，怎么还不走呀，是想和若儿再聊会天嘛
  sub2: 呜~若儿好感动，很少有人会这样做呢
  sub3: 那么，“如你所见”若儿是可爱的女孩子哦
  sub4: 虽然这还只是停留在心中的小小愿望
  sub5: 虽然有各种阻碍难以跨越
  sub6: 但只要依旧存在光亮，若儿也会一直努力的
  sub7: 想必来到这里的你也会有属于自己的愿望吧
  sub8: 尽管若儿也不能做到些什么，但
  sub9: 愿所有美好的心愿都能得到祝福
descrip: 你好呀 #下方的

